
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRESCRIPTS OF THE BLANKDEX</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #101810 0%,
                    #080b08 55%,
                    #030403 100%
                );

            color: #d9ffe1;
            font-family: "Special Elite", monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            animation: screenFlicker 5s infinite;
        }


        

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            z-index: 100;
        }


        

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 45%,
                    rgba(0,0,0,0.65) 100%
                );

            z-index: 99;
        }


        

        .terminal {
            width: min(720px, 90vw);
            min-height: 430px;

            padding: 35px;

            background:
                linear-gradient(
                    rgba(5, 15, 8, 0.96),
                    rgba(2, 7, 4, 0.98)
                );

            border: 1px solid #62ff82;

            box-shadow:
                0 0 10px rgba(98,255,130,0.5),
                0 0 30px rgba(98,255,130,0.18),
                inset 0 0 30px rgba(98,255,130,0.04);

            position: relative;

            animation:
                terminalFlicker 7s infinite,
                terminalFloat 6s ease-in-out infinite;
        }


        

        .terminal::before,
        .terminal::after {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            border-color: #8aff9c;
            border-style: solid;
        }

        .terminal::before {
            top: -1px;
            left: -1px;

            border-width: 2px 0 0 2px;
        }

        .terminal::after {
            bottom: -1px;
            right: -1px;

            border-width: 0 2px 2px 0;
        }


        

        .topbar {
            display: flex;
            justify-content: space-between;

            color: #79ff91;

            font-size: 12px;
            letter-spacing: 2px;

            opacity: 0.75;

            margin-bottom: 35px;
        }


      

        .title {
            text-align: center;

            font-size: clamp(28px, 6vw, 52px);

            letter-spacing: 7px;

            color: #caffd3;

            margin-bottom: 12px;

            text-shadow:
                0 0 4px #72ff8c,
                0 0 12px rgba(75,255,110,0.7);

            position: relative;

            animation: titleFlicker 4s infinite;
        }


        
        .subtitle {
            text-align: center;

            color: #78b982;

            font-size: 16px;

            white-space: nowrap;

            letter-spacing: 1px;

            margin-bottom: 35px;
        }


        

        .message-box {
            min-height: 115px;

            padding: 22px;

            border: 1px solid rgba(110,255,130,0.45);

            background: rgba(0,0,0,0.25);

            box-shadow:
                inset 0 0 20px rgba(0,255,70,0.035);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            margin-bottom: 25px;
        }


        .message {
            font-size: 18px;

            line-height: 1.6;

            color: #e1ffe6;

            text-shadow:
                0 0 5px rgba(100,255,130,0.8);

            word-break: normal;
        }


        .resume-directive {
            animation: resumeDirectiveReveal 1.6s ease-out both;
        }


        .red-letter {
            color: #ff4d4d;
        }


        .maximum-message {
            color: #ff3030;
            text-shadow: 0 0 5px rgba(255,40,40,0.8);
            animation: maximumShake 0.18s infinite;
        }


        .ranking-message {
            color: #78cfff;
            text-shadow: 0 0 5px rgba(80,190,255,0.8);
        }


        

        .cursor {
            display: inline-block;

            width: 9px;
            height: 20px;

            margin-left: 5px;

            background: #9affaa;

            vertical-align: middle;

            box-shadow:
                0 0 8px #69ff87;

            animation: cursorBlink 0.7s infinite;
        }


        

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

            justify-content: center;

            margin-top: 10px;
        }


        button {
            background: #101810;

            color: #aaffb4;

            border: 1px solid #72ff8c;

            padding: 13px 28px;

            font-family: "Special Elite", monospace;

            font-size: 14px;

            letter-spacing: 2px;

            text-align: center;

            cursor: pointer;

            transition:
                background 0.2s,
                box-shadow 0.2s,
                transform 0.1s;

            box-shadow:
                0 0 7px rgba(90,255,110,0.2);
        }


        .directive-action {
            min-width: 220px;
            padding: 9px 18px;
            font-size: 12px;
        }


        .directive-action:disabled {
            opacity: 0.35;
        }


        .offline button,
        button.offline {
            background: #030403;
            color: #304435;
            border-color: #253328;
            box-shadow: none;
            opacity: 0.3;
            cursor: not-allowed;
        }


        .counter-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 22px;
        }


        .counter-column {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }


        .counter {
            width: 130px;
            padding: 9px 12px;
            border: 1px solid rgba(110,255,130,0.45);
            background: rgba(0,0,0,0.3);
            color: #aaffb4;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
        }


        .reset-button {
            width: 130px;
            padding: 8px 6px;
            font-size: 10px;
            letter-spacing: 1px;
        }


        .mood-box {
            width: 130px;
            min-height: 34px;
            padding: 8px 4px;
            border: 1px solid rgba(110,255,130,0.45);
            background: rgba(0,0,0,0.3);
            color: #aaffb4;
            font-size: 14px;
            text-align: center;
        }


        .mood-box:focus-visible {
            outline: 1px solid #caffd3;
            outline-offset: 3px;
        }


        button:hover {
            background: #18351e;

            box-shadow:
                0 0 12px rgba(100,255,120,0.6),
                inset 0 0 10px rgba(100,255,120,0.1);

            text-shadow:
                0 0 8px #9affaa;
        }


        button:active {
            transform: scale(0.96);
        }


        button:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }


    

        .status {
            margin-top: 25px;

            text-align: center;

            font-size: 11px;

            letter-spacing: 2px;

            color: #4e8c59;

            min-height: 15px;
        }


        
        .glitch {
            animation: textGlitch 0.12s infinite;
        }


        
        @keyframes cursorBlink {
            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }
        }


        @keyframes screenFlicker {
            0%,
            18%,
            20%,
            62%,
            64%,
            100% {
                opacity: 1;
            }

            19%,
            63% {
                opacity: 0.96;
            }
        }


        @keyframes terminalFlicker {
            0%,
            100% {
                opacity: 1;
            }

            49% {
                opacity: 0.98;
            }

            50% {
                opacity: 0.94;
            }

            51% {
                opacity: 1;
            }
        }


        @keyframes titleFlicker {
            0%,
            92%,
            100% {
                opacity: 1;
            }

            93% {
                opacity: 0.6;
            }

            94% {
                opacity: 1;
            }

            96% {
                opacity: 0.8;
            }
        }


        @keyframes terminalFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }


        @keyframes textGlitch {
            0% {
                transform: translateX(0);
                text-shadow:
                    2px 0 #75ff91,
                    -2px 0 #164d22;
            }

            25% {
                transform: translateX(-2px);
            }

            50% {
                transform: translateX(2px);
                text-shadow:
                    -3px 0 #75ff91,
                    3px 0 #164d22;
            }

            75% {
                transform: translateX(-1px);
            }

            100% {
                transform: translateX(0);
            }
        }


        @keyframes maximumShake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-1px) rotate(-0.2deg);
            }

            75% {
                transform: translateX(1px) rotate(0.2deg);
            }
        }


        @keyframes resumeDirectiveReveal {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


       

        @media (max-width: 600px) {

            .terminal {
                padding: 22px;

                min-height: 400px;
            }

            .topbar {
                font-size: 9px;
            }

            .title {
                letter-spacing: 4px;
            }

            .message {
                font-size: 15px;
            }

            .message-box {
                min-height: 130px;
            }

            .counter-row {
                gap: 10px;
            }

            .counter {
                width: 120px;
            }

            .reset-button,
            .mood-box {
                width: 120px;
            }
        }

    </style>
</head>


<body>

    <main class="terminal">

        <div class="topbar">
            <span id="systemLabel">SYSTEM // BLANK</span>
            <span id="statusLabel">STATUS: ONLINE</span>
        </div>


        <div class="subtitle">
            <span id="subtitleText">Click the button below to receive your directive.</span>
        </div>


        <div class="message-box">

            <div class="message">
                <span id="messageText"></span><span class="cursor"></span>
            </div>

        </div>


        <div class="button-container">

            <button id="receiveButton">
                RECEIVE DIRECTIVE
            </button>

            <button class="directive-action" id="completeButton" disabled>
                Directive Completed
            </button>

            <button class="directive-action" id="denyButton" disabled>
                Directive Denied
            </button>

        </div>


        <div class="counter-row">

            <div class="counter-column">
                <div class="counter">
                    Consequences: <span id="deniedCount">0</span>
                </div>

                <button class="reset-button" id="resetButton">
                    Reset Progress?
                </button>
            </div>

            <div class="counter-column">
                <div class="counter">
                    Completed: <span id="completedCount">0</span>
                </div>

                <button class="mood-box" id="creditsButton" type="button">(˶˃ ᵕ ˂˶)</button>
            </div>

        </div>


        <div class="status" id="status">
            AWAITING INPUT...
        </div>

    </main>


    <script>

        

        const messageText =
            document.getElementById("messageText");

        const message =
            document.querySelector(".message");

        const button =
            document.getElementById("receiveButton");

        const completeButton =
            document.getElementById("completeButton");

        const denyButton =
            document.getElementById("denyButton");

        const deniedCount =
            document.getElementById("deniedCount");

        const completedCount =
            document.getElementById("completedCount");

        const resetButton =
            document.getElementById("resetButton");

        const creditsButton =
            document.getElementById("creditsButton");

        const status =
            document.getElementById("status");

        const systemLabel =
            document.getElementById("systemLabel");

        const statusLabel =
            document.getElementById("statusLabel");

        const subtitleText =
            document.getElementById("subtitleText");

        const buttonContainer =
            document.querySelector(".button-container");

        const typingAudio = [
            new Audio("Typing1.mp3"),
            new Audio("Typing2.mp3")
        ];

        const typingDoneAudio =
            new Audio("TypingDone.mp3");

        const completedAudio =
            new Audio("Completed.ogg");

        const completed2Audio =
            new Audio("Completed2.mp3");

        const deniedAudio =
            new Audio("Denied.mp3");

        const execution1Audio =
            new Audio("Execution1.mp3");

        const execution2Audio =
            new Audio("Execution2.mp3");

        const theyComingAudio =
            new Audio("TheyComing.mp3");

        const resetting1Audio =
            new Audio("Resetting.mp3");

        const resetting2Audio =
            new Audio("Resetting2.mp3");

        const resetting3Audio =
            new Audio("Resetting3.ogg");

        typingAudio.forEach((audio) => {
            audio.loop = true;
        });

        function playAudio(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function startTypingAudio(typingTrack = "both") {
            const tracks = typingTrack === "typing1"
                ? [typingAudio[0]]
                : typingTrack === "typing2"
                    ? [typingAudio[1]]
                    : typingAudio;

            tracks.forEach(playAudio);
        }

        function stopTypingAudio() {
            typingAudio.forEach((audio) => {
                audio.pause();
                audio.currentTime = 0;
            });
        }

        function playExecution1Twice() {
            playAudio(execution1Audio);
            setTimeout(() => playAudio(execution1Audio), 500);
        }

        function startTheyComingAudio() {
            stopTheyComingAudio();
            theyComingAudio.loop = false;

            theyComingLoopHandler = () => {
                theyComingLoopTimer = setTimeout(() => {
                    playAudio(theyComingAudio);
                    theyComingLoopTimer = null;
                }, 250);
            };

            theyComingAudio.addEventListener("ended", theyComingLoopHandler);
            playAudio(theyComingAudio);
        }

        function stopTheyComingAudio() {
            if (theyComingLoopHandler) {
                theyComingAudio.removeEventListener("ended", theyComingLoopHandler);
                theyComingLoopHandler = null;
            }

            clearTimeout(theyComingLoopTimer);
            theyComingLoopTimer = null;

            theyComingAudio.pause();
            theyComingAudio.currentTime = 0;
        }


        

        const specialSkipDirective =
            "You can skip this Prescript, but you must complete the next 3 Prescripts in a row without skipping any of them.";

        const directives = [

            "Go to the nearest person you dislike, then recite a poem about oranges. Then proceed to take a bite out of their shoulder.",

            "Remove and uninstall all your games, then you must reinstall one game of your choice, and play it for a year.",

            "Lick the nearest wall, then proceed to lick the nearest floor. Then you must lick the nearest ceiling. Describe the taste to your sleeping parent, while your eyes are closed.",

            "4 hours from now, you must go to sleep, and sleep standing upward.",

            "Take three steps forward. Afterwards, play Chess with a plushie of your choice, and you must purposely lose to it.",

            "At 32 hours from now, send Miss Perlica 30k in PayPal to support Endfield Industries.",

            "Get a girlfriend, and grow a relationship for her for 5 years, then let her die in a grave accident while you are observing.",

            "Play games for 72 hours straight, and you must not sleep, eat, drink or go to the bathroom. If you pass out, you have completed the Prescript. Repeat until you pass out.",

            "Blindfold yourself, and proceed to cross a busy street. You must not remove the blindfold until you reach the other side.",

            "Fix your posture, drink water everyday, and exercise for 30 minutes a day. You must do this for 1 year.",

            "Continue with your current task.",

            "Do not acknowledge this message.",

            "Stare at the ceiling for 3 hours, and speak a 400 word essay about the ceiling. You must not look away from the ceiling.",

            "Sleep 6 hours early, and wake up 6 hours early. You must do this for 1 month.",

            "Collect your own pee in a bottle, then proceed to make a makeshift water gun, and spray it to your dearest ones.",

            "Watch 10 YouTube shorts with subway surfers/minecraft parkour game play per hour for the next 50 hours, do not sleep without completing this prescript",

            "Go to Kuro Games and hold multiple employees hostage while demanding a rerun for the Wuthering Waves character, Camellya.",

            "Acquire a Labubu toy and force feed it to the next child you see within the age range of 1-6 years old.",

            "If you drop the drop cloth, stand still and eat only foods that are.",

            "Put 3 needles in your neighbor's birthday cake. Proceed to lick their table before they arrive. Do not wash your hands.",

            "Imitate a demoted Fixer who was lost in the Library, down to their life, interests, history, love interest, everything. Then you must imitate how they would die.",

            "You must convince everyone who plays Wuthering Waves that Yinlin is currently meta.",

            "You must convince everyone who plays Limbus Company that N. Corp Großhammer Meursault is an S-tier meta character.",

            "Travel to Hong Kong and convince the people there that the city is a part of China, and that they are Chinese citizens. You must do this for 1 month.",

            "Discover a cave with weird and terraformed pathways. Then at the crossroads, turn left. Always turn left.",

            "Gather your friends and play a game of hide and seek in the middle of the night. You must not use any lights or flashlights. Add a twist that there is an escaped offender is on the loose, and have them hunt for each of you.",

            specialSkipDirective,

            "If you are a person with the letters: 'a', 'd', 'r', 'i','s', and 't' in your name, you must run a lap around your home to your nearest restaurant, then at the middlemost part of your destination at the third lap, turn right, and walk straight for 17 minutes.",

            "Let a silent fart out and say 'Do I smell popcorn?' to make everyone get a big huff of it.",

            "Buy a beer from a local store, then make a bamboo hat out of bamboo sticks. Wait for the rain to come, and sit drinking, with the bamboo hat on.",

            "You either beat the current top 60 extreme demon in Geometry Dash, or confine yourself in a detached blank white room where time doesn't pass by, and you cannot feel the need to eat, drink, defecate nor pee. Just focused on second Prescript where you will slap your hand repeatedly on an indestructible table until your atoms align with the table's atoms and pass through it.",

            "Look forward, stand between the drunk man and the nearest exit. Next, lie and say you failed this prescript.",

            "After reaching shelter, yell at the first teacher you notice about the 38th person you met.",

            "After changing clothes, have a debate about names you've answered to. You must keep in contact with them for the next 8 hours.",

            "Within the next 96 hours, walk 523 meters, then turn right, share an observation about the wings with the first person you meet after receiving the prescript.",

            "Tonight, listen carefully and pretend you recognize someone standing alone.",

            "Take a step and stand where the quietest girl you know can see you but not reach you. Within 11 seconds, carve this prescript into them.",

            "Do not attempt to avoid this and begin moving again and ask the one you love most an unrelated question. Give 6 dollars to a homeless man without looking back.",

            "Within the next 24 hours, travel to the place where Charlie Kirk has been buried, then proceed to dig up his grave and revive him. Proceed to debate against him about whether or not transgender women can participate in running sports for women only.",

            "If you feel cold, attack the first good looking person that looks at you, then bring them to a place you call home, then feed him his own throat.",

            "Shift your weight and eat a bag of your favorite food while watching a gut churning documentary",

            "Do not go to sleep until you have recited the first 133 digits of Euler's value '(e)' tonight.",

            


            



        ];


        
        let typingTimer = null;

        let countdownTimer = null;

        let executionCountdownTimer = null;

        let executionArrivalMinutes = 0;

        let theyComingLoopHandler = null;

        let theyComingLoopTimer = null;

        let resetSequenceTimer = null;

        let isProcessing = false;

        let deniedTotal = 0;

        let completedTotal = 0;

        let currentRank = "";

        let currentDirective = "";

        let resetLocked = false;

        let isResetting = false;

        let resetDotsTimer = null;

        let resetting1EndedHandler = null;

        let recentDirectives = [];

        let creditsMode = false;

        let creditPage = 0;

        const creditTexts = [
            "SFX sourced from Forsaken, developed and published by the Forsaken Dev Team. Used for non-commercial fan-project purposes. All rights to the original audio belong to their respective copyright holders.",
            "Other SFX sourced from Limbus Company, developed by Project Moon. Website inspired by nyos.dev and neocities.org. Used for non-commercial fan-project purposes.",
            "Website is based on \"The Index\" from Limbus Company. All rights belong to Project Moon."
        ];

        const progressStorageKey = "prescripts-of-the-blankdex-progress";

        let claimedMilestones = [];

        const completionMessages = [

            "The Will of The City guides you.",

            "-CLEAR-",

            "-CLEAR-",

            "For it is the Will of The City.",

            "The Will of Hesham lights your way.",

            "As the Prescript commands.",

            "The Prescript points your way forward."

        ];

        const openingMessages = [
            "-Do you hear the waves?-",
            "-I hear the waves.-",
            "-Perlica is waiting on that 30k payment.-",
            "-Camellya rerun will never happen.-"
        ];

        function getOpeningMessage() {
            return Math.random() < 0.05
                ? openingMessages[
                    Math.floor(
                        Math.random() * openingMessages.length
                    )
                ]
                : "-RECEIVE-";
        }


        function loadProgress() {
            try {
                const savedProgress =
                    JSON.parse(localStorage.getItem(progressStorageKey));

                if (!savedProgress) {
                    return;
                }

                deniedTotal = Math.max(0, Number(savedProgress.deniedTotal) || 0);
                completedTotal = Math.max(0, Number(savedProgress.completedTotal) || 0);
                claimedMilestones = Array.isArray(savedProgress.claimedMilestones)
                    ? savedProgress.claimedMilestones
                    : [];
                currentRank = savedProgress.currentRank || "";
                currentDirective = savedProgress.currentDirective || "";
                recentDirectives = Array.isArray(savedProgress.recentDirectives)
                    ? savedProgress.recentDirectives.filter((directive) =>
                        directives.includes(directive)
                    ).slice(-2)
                    : [];
                resetLocked = Boolean(savedProgress.resetLocked);
            } catch (error) {
                deniedTotal = 0;
                completedTotal = 0;
                claimedMilestones = [];
            }

            deniedCount.textContent = deniedTotal;
            completedCount.textContent = completedTotal;

            if (!currentRank) {
                const earnedRanks = milestoneRanks.filter(([threshold]) =>
                    claimedMilestones.includes(threshold)
                );

                currentRank = earnedRanks.length
                    ? earnedRanks[earnedRanks.length - 1][1]
                    : "";
            }

            if (currentRank) {
                systemLabel.textContent = "SYSTEM // " + currentRank;
            }

            updateResetButtonAvailability();
        }


        function saveProgress() {
            try {
                localStorage.setItem(
                    progressStorageKey,
                    JSON.stringify({
                        deniedTotal,
                        completedTotal,
                        claimedMilestones,
                        currentRank,
                        currentDirective,
                        recentDirectives,
                        resetLocked
                    })
                );
            } catch (error) {
            }
        }


        function updateResetButtonAvailability() {
            if (!resetLocked) {
                resetButton.disabled = false;
                return;
            }

            if (deniedTotal >= 10 || completedTotal >= 7) {
                resetLocked = false;
                resetButton.disabled = false;
                saveProgress();
                return;
            }

            resetButton.disabled = true;
        }


        function resetProgress() {
            creditsMode = false;
            button.textContent = "RECEIVE DIRECTIVE";
            creditsButton.textContent = "(˶˃ ᵕ ˂˶)";
            clearInterval(countdownTimer);
            clearInterval(executionCountdownTimer);
            clearInterval(typingTimer);
            clearTimeout(resetSequenceTimer);
            clearTimeout(resetDotsTimer);
            clearInterval(resetDotsTimer);
            stopTypingAudio();
            if (resetting1EndedHandler) {
                resetting1Audio.removeEventListener("ended", resetting1EndedHandler);
                resetting1EndedHandler = null;
            }
            resetting1Audio.pause();
            resetting1Audio.currentTime = 0;

            deniedTotal = 0;
            completedTotal = 0;
            claimedMilestones = [];
            currentRank = "";
            currentDirective = "";
            recentDirectives = [];
            resetLocked = true;
            isResetting = true;

            saveProgress();

            deniedCount.textContent = "0";
            completedCount.textContent = "0";
            systemLabel.textContent = "SYSTEM // BLANK";
            statusLabel.textContent = "STATUS: ONLINE";
            subtitleText.textContent = "Click the button below to receive your directive.";
            status.textContent = "RESETTING PROGRESS";
            message.classList.remove("maximum-message");
            message.classList.add("ranking-message");
            button.disabled = true;
            setActionButtons(false);
            resetButton.disabled = true;
            isProcessing = true;
            playAudio(resetting3Audio);

            resetSequenceTimer = setTimeout(() => {
                eraseText(4, () => {
                    resetting1Audio.loop = false;
                    playAudio(resetting1Audio);

                    resetting1EndedHandler = () => {
                        resetting1EndedHandler = null;
                        clearTimeout(resetDotsTimer);
                        clearInterval(resetDotsTimer);
                        clearInterval(typingTimer);
                        stopTypingAudio();
                        resetting1Audio.pause();
                        resetting1Audio.currentTime = 0;

                        setTimeout(() => {
                            messageText.textContent = "";
                            playAudio(resetting2Audio);

                            setTimeout(() => {
                                typeText(
                                    "Reset Complete.",
                                    32,
                                    () => {
                                        setTimeout(() => {
                                            typeText(
                                                Math.random() < 0.5
                                                    ? "-The Will of The City greets you.-"
                                                    : "-Receive your Prescript.-",
                                                32,
                                                () => {
                                                    setTimeout(() => {
                                                        button.disabled = false;
                                                        setActionButtons(false);
                                                        resetButton.disabled = true;
                                                        isProcessing = false;
                                                        isResetting = false;
                                                        status.textContent = "PROGRESS RESET";
                                                    }, 1500);
                                                }
                                            );
                                        }, 1000);
                                    }
                                );
                            }, 700);
                        }, 1000);
                    };

                    resetting1Audio.addEventListener("ended", resetting1EndedHandler, { once: true });

                    typeText(
                        "Resetting progress.",
                        32,
                        () => {
                            let dots = 1;
                            resetDotsTimer = setTimeout(() => {
                                resetDotsTimer = setInterval(() => {
                                    messageText.textContent =
                                        "Resetting progress" + ".".repeat(dots);
                                    dots = dots === 3 ? 1 : dots + 1;
                                }, 250);
                            }, 250);
                        }
                    );

                }, "typing1");
            }, 1000);
        }


        const milestoneRanks = [
            [10, "Proselyte"],
            [30, "Proxy"],
            [55, "Messenger"],
            [80, "The Oracle's Proxy"],
            [110, "The Oracle's Messenger"],
            [130, "The Weaver"]
        ];


        function getMilestoneRank(count) {
            const milestone = milestoneRanks.find(([threshold]) => threshold === count);

            if (!milestone || claimedMilestones.includes(count)) {
                return null;
            }

            return milestone[1];
        }


        function showMilestoneRanking(rank) {
            const rankingText =
                "Congratulations. By doing the Will of The City, you have been ranked as a "
                + rank
                + ". To where the Prescript points, and as it commands. For it is the Will of The City.";

            clearInterval(typingTimer);
            stopTypingAudio();
            setActionButtons(false);
            currentRank = rank;
            systemLabel.textContent = "SYSTEM // " + currentRank;
            saveProgress();
            message.classList.add("ranking-message");

            setTimeout(() => {
                eraseText(24, () => {
                    setTimeout(() => {
                        typeText(rankingText, 32, null, 0, "ranking-message");
                    }, 1000);
                }, "typing1");
            }, 1000);
        }


        

        function typeText(text, speed = 28, onComplete = null, redChance = 0, messageClass = "", typingTrack = "both") {

            clearInterval(typingTimer);
            stopTypingAudio();
            startTypingAudio(typingTrack);

            messageText.textContent = "";
            message.classList.remove("maximum-message");
            message.classList.remove("ranking-message");

            if (messageClass) {
                message.classList.add(messageClass);
            }

            let index = 0;


            typingTimer = setInterval(() => {

                const character = text[index];
                const characterElement = document.createElement("span");

                characterElement.textContent = character;

                if (character !== " " && Math.random() < redChance) {
                    characterElement.className = "red-letter";
                }

                messageText.appendChild(characterElement);

                index++;


                if (index >= text.length) {

                    clearInterval(typingTimer);

                    typingTimer = null;
                    stopTypingAudio();

                    if (onComplete) {
                        onComplete();
                    }

                }

            }, speed);
        }


        

        function glitchEffect() {

            const original =
                messageText.textContent;


            if (!original) {
                return;
            }


            const characters =
                "!@#$%^&*<>[]{}01ABCDEFGHIJKLMNOPQRSTUVWXYZ";


            let count = 0;

            const totalGlitches = 8;


            const glitchTimer = setInterval(() => {

                let output = "";


                for (
                    let i = 0;
                    i < original.length;
                    i++
                ) {

                    if (
                        original[i] !== " " &&
                        Math.random() < 0.12
                    ) {

                        output +=
                            characters[
                                Math.floor(
                                    Math.random() *
                                    characters.length
                                )
                            ];

                    } else {

                        output += original[i];

                    }

                }


                messageText.textContent = output;

                message.classList.add("glitch");


                count++;


                if (count >= totalGlitches) {

                    clearInterval(glitchTimer);

                    

                    renderMessageText(original, getRedLetterChance());

                    message.classList.remove("glitch");

                }

            }, 70);
        }


        function renderMessageText(text, redChance) {
            messageText.textContent = "";

            for (const character of text) {
                const characterElement = document.createElement("span");

                characterElement.textContent = character;

                if (character !== " " && Math.random() < redChance) {
                    characterElement.className = "red-letter";
                }

                messageText.appendChild(characterElement);
            }
        }


        function setActionButtons(enabled) {
            completeButton.disabled = !enabled;
            denyButton.disabled = !enabled;
        }


        function setOfflineState(enabled) {
            buttonContainer.classList.toggle("offline", enabled);
            button.disabled = enabled;
            setActionButtons(false);
        }


        function getRedLetterChance() {
            if (deniedTotal >= 100) {
                return 0.75;
            }

            if (deniedTotal >= 75) {
                return 0.5;
            }

            if (deniedTotal >= 50) {
                return 0.25;
            }

            if (deniedTotal >= 25) {
                return 0.05;
            }

            return 0;
        }


        function showMaximumConsequence() {
            clearInterval(countdownTimer);
            clearInterval(executionCountdownTimer);
            clearInterval(typingTimer);
            stopTypingAudio();
            stopTheyComingAudio();
            executionArrivalMinutes =
                30 + Math.floor(Math.random() * 21);
            currentDirective = "";
            saveProgress();
            setOfflineState(true);
            systemLabel.textContent = "SYSTEM // BLANK";
            statusLabel.textContent = "STATUS: ONLINE";
            subtitleText.textContent = "Click the button below to receive your directive.";
            status.textContent = "CONSEQUENCES MAXIMUM";
            messageText.textContent = "";

            setTimeout(() => {
                playExecution1Twice();
                typeText(
                    "The Beeper has detected the maximum count for Consequences.",
                    32,
                    () => {
                        setTimeout(() => {
                            eraseText(24, () => {
                                systemLabel.textContent = "SYSTEM // EXECUTION";
                                statusLabel.textContent = "STATUS: LOCATED";
                                subtitleText.textContent = "Stand still. Do not resist. For it is the Will of The City.";

                                playExecution1Twice();
                                typeText(
                                    "Multiple Proxies have been notified of your location.",
                                    32,
                                    () => {
                                        startTheyComingAudio();
                                        setTimeout(() => {
                                            stopTheyComingAudio();
                                            eraseText(24, () => {
                                                typeText(
                                                    "They will be arriving in exactly "
                                                    + executionArrivalMinutes
                                                    + " minutes.",
                                                    32,
                                                    () => {
                                                        setTimeout(() => {
                                                            playAudio(execution2Audio);
                                                            startExecutionCountdown();
                                                            typeText(
                                                                "Goodbye.",
                                                                32,
                                                                null,
                                                                1,
                                                                "maximum-message",
                                                                "typing1"
                                                            );
                                                        }, 5000);
                                                    },
                                                    1,
                                                    "maximum-message",
                                                    "typing1"
                                                );
                                            }, "typing1");
                                        }, 5000);
                                    },
                                    1,
                                    "maximum-message",
                                    "typing1"
                                );
                            }, "typing1");
                        }, 5000);
                    },
                    1,
                    "maximum-message",
                    "typing1"
                );
            }, 1000);
        }


        function eraseText(speed, onComplete = null, typingTrack = "both") {
            clearInterval(typingTimer);
            stopTypingAudio();
            startTypingAudio(typingTrack);

            let text = messageText.textContent;

            typingTimer = setInterval(() => {
                text = text.slice(0, -1);
                messageText.textContent = text;

                if (!text) {
                    clearInterval(typingTimer);
                    typingTimer = null;
                    stopTypingAudio();

                    if (onComplete) {
                        onComplete();
                    }
                }
            }, speed);
        }


        function startExecutionCountdown() {
            clearInterval(executionCountdownTimer);

            let remaining = executionArrivalMinutes * 60;

            function updateExecutionCountdown() {
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                const formatted =
                    String(minutes).padStart(2, "0")
                    + ":"
                    + String(seconds).padStart(2, "0");

                status.textContent =
                    "PROXIES WILL ARRIVE AT "
                    + executionArrivalMinutes
                    + " MINUTES // "
                    + formatted;

                if (remaining <= 0) {
                    clearInterval(executionCountdownTimer);
                    systemLabel.textContent = "SYSTEM // BLANK";
                    statusLabel.textContent = "STATUS: ONLINE";
                    subtitleText.textContent = "Click the button below to receive your directive.";
                    message.classList.remove("maximum-message");
                    setOfflineState(false);
                    button.disabled = false;
                    isProcessing = false;
                    status.textContent = "NEW PRESCRIPT AVAILABLE";
                    typeText(getOpeningMessage(), 35);
                }

                remaining--;
            }

            updateExecutionCountdown();
            executionCountdownTimer =
                setInterval(updateExecutionCountdown, 1000);
        }


        function showDirective(directive) {
            rememberDirective(directive);
            currentDirective = directive;
            saveProgress();
            status.textContent = "PRESCRIPT RECEIVED";

            typeText(directive, 32, () => {
                stopTypingAudio();
                glitchEffect();
                setActionButtons(true);
                playAudio(typingDoneAudio);
            }, getRedLetterChance());
        }


        function showSavedDirective(directive) {
            rememberDirective(directive);
            currentDirective = directive;
            saveProgress();
            status.textContent = "PRESCRIPT RESTORED";
            messageText.classList.remove("resume-directive");
            renderMessageText(directive, getRedLetterChance());
            void messageText.offsetWidth;
            messageText.classList.add("resume-directive");
            setActionButtons(true);
        }


        function showCreditPage() {
            clearInterval(typingTimer);
            stopTypingAudio();
            messageText.textContent = "";
            typeText(creditTexts[creditPage], 24, null, 0, "", "typing2");
        }


        function enterCredits() {
            if (isResetting) {
                return;
            }

            creditsMode = true;
            creditPage = 0;
            button.disabled = false;
            button.textContent = "NEXT";
            creditsButton.textContent = "CREDITS";
            setActionButtons(false);
            playAudio(execution1Audio);
            showCreditPage();
        }


        function exitCredits() {
            creditsMode = false;
            button.textContent = "RECEIVE DIRECTIVE";
            creditsButton.textContent = "(˶˃ ᵕ ˂˶)";
            playAudio(execution2Audio);
            clearInterval(typingTimer);
            stopTypingAudio();
            messageText.textContent = "";

            if (currentDirective) {
                showSavedDirective(currentDirective);
                return;
            }

            button.disabled = isProcessing;
            typeText(getOpeningMessage(), 35);
        }


        function advanceCredits() {
            playAudio(deniedAudio);
            creditPage = (creditPage + 1) % creditTexts.length;
            showCreditPage();
        }


        function getRandomDirective() {
            const availableDirectives = directives.filter((directive) =>
                !recentDirectives.includes(directive)
            );

            const selectableDirectives = availableDirectives.length
                ? availableDirectives
                : directives;

            return selectableDirectives[
                Math.floor(Math.random() * selectableDirectives.length)
            ];
        }


        function rememberDirective(directive) {
            recentDirectives = recentDirectives.filter((recentDirective) =>
                recentDirective !== directive
            );
            recentDirectives.push(directive);
            recentDirectives = recentDirectives.slice(-2);
        }


        function rerollDirective() {
            const deniedDirective = currentDirective;

            const directive = getRandomDirective();

            currentDirective = directive;
            saveProgress();

            if (deniedDirective === specialSkipDirective) {
                completedTotal++;
                completedCount.textContent = completedTotal;
            } else {
                deniedTotal += 5;
                deniedCount.textContent = deniedTotal;
            }
            updateResetButtonAvailability();
            saveProgress();
            setActionButtons(false);
            status.textContent = "DIRECTIVE DENIED // REROLLING...";

            if (deniedTotal >= 125) {
                showMaximumConsequence();
                return;
            }

            setTimeout(() => {
                showDirective(directive);
            }, 350);
        }


       

        function startCountdown(seconds) {

            clearInterval(countdownTimer);


            let remaining = seconds;


            function updateCountdown() {

                const minutes =
                    Math.floor(remaining / 60);

                const secs =
                    remaining % 60;


                const formatted =
                    String(minutes).padStart(2, "0")
                    + ":"
                    + String(secs).padStart(2, "0");


                status.textContent =
                    "NEW PRESCRIPT AVAILABLE IN "
                    + formatted;


                if (remaining <= 0) {

                    clearInterval(countdownTimer);

                    status.textContent =
                        "NEW PRESCRIPT AVAILABLE";

                    setActionButtons(false);
                    button.disabled = false;

                    isProcessing = false;

                }


                remaining--;

            }


            updateCountdown();

            countdownTimer =
                setInterval(updateCountdown, 1000);
        }


       

        button.addEventListener("click", () => {

            if (creditsMode) {
                advanceCredits();
                return;
            }

            if (isProcessing) {
                return;
            }


            isProcessing = true;

            button.disabled = true;


            clearInterval(typingTimer);


            const directive = getRandomDirective();


            status.textContent =
                "ACCESSING PRESCRIPT DATABASE...";


            

            setTimeout(() => {

                showDirective(directive);

            }, 600);

        });


        completeButton.addEventListener("click", () => {

            if (!isProcessing || completeButton.disabled) {
                return;
            }

            completedTotal++;
            completedCount.textContent = completedTotal;
            deniedTotal = Math.max(0, deniedTotal - 2);
            deniedCount.textContent = deniedTotal;
            currentDirective = "";
            updateResetButtonAvailability();
            setActionButtons(false);
            status.textContent = "DIRECTIVE COMPLETED";
            playAudio(completedAudio);
            startCountdown(15);

            const milestoneRank = getMilestoneRank(completedTotal);

            if (milestoneRank) {
                claimedMilestones.push(completedTotal);
                saveProgress();
                status.textContent = "RANKING AWARDED";
                showMilestoneRanking(milestoneRank);
                return;
            }

            saveProgress();

            const completionMessage =
                completionMessages[
                    Math.floor(
                        Math.random() * completionMessages.length
                    )
                ];

            typeText(completionMessage, 32, () => {
                playAudio(completed2Audio);
            });
        });


        denyButton.addEventListener("click", () => {

            if (!isProcessing || denyButton.disabled) {
                return;
            }

            playAudio(deniedAudio);
            rerollDirective();
        });


        resetButton.addEventListener("click", () => {
            resetProgress();
        });


        creditsButton.addEventListener("click", () => {
            if (creditsMode) {
                exitCredits();
                return;
            }

            enterCredits();
        });


        
        loadProgress();

        if (currentDirective) {
            isProcessing = true;
            button.disabled = true;
            showSavedDirective(currentDirective);

        } else {
            typeText(
                getOpeningMessage(),
                35
            );
        }

    </script>

</body>
</html>
